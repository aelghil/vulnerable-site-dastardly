name: CRON TEST — delete me

# TEMPORARY DIAGNOSTIC. Delete once the question is answered.
#
# Question: do scheduled triggers fire at all in this repository?
#
# publish.yml has produced zero scheduled runs while manual dispatch works.
# Every local check passes — the file is valid, it is on the default branch
# (verified with `git ls-remote --symref origin HEAD`), the cron parses, and
# Actions plainly works. So the fault is not in the config.
#
# This does nothing but print the time, every five minutes. It is the cheapest
# way to distinguish two cases that need completely different fixes:
#
#   It fires        -> schedules work; something is specific to publish.yml.
#   It never fires  -> schedules are dead for this repo; stop tuning cron and
#                      trigger the publish some other way.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Say when this ran and what triggered it
        run: |
          echo "UTC now      : $(date -u '+%F %H:%M:%SZ')"
          echo "event        : ${{ github.event_name }}"
          echo "ref          : ${{ github.ref }}"
          echo "workflow ran : yes"
